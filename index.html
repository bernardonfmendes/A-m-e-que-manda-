<title>A Mãe é que Sabe</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF6F2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: um caderno de receitas pousado numa toalha de xadrez. A folha (.shell) leva o cabeçalho, as definições da semana e a vista ativa; as fichas são cartões de papel com bainha cosida a tracejado; os separadores ficam numa tira de pano no fundo. Títulos e etiquetas à mão (Caveat), texto corrido em Nunito, números e fichas de ingredientes em Courier Prime. Os preços são pedaços de fita-cola amarela com o valor escrito por cima; é o único toque forte. */
:root{
  --bg:#FFF6F2;            /* toalha: base */
  --check:rgba(190,48,40,.14);
  --paper:#FFFDF8;         /* folha do caderno */
  --card:#FFFFFF;
  --field:#FFFFFF;
  --ink:#1F2A44;           /* tinta de caneta azul-escura */
  --ink-2:#56607E;
  --line:#E4D8CC;
  --line-2:#F0E8DE;
  --line-d:#CBBBA9;        /* costura e contornos */
  --rule:#BFD1EC;          /* linhas do caderno */
  --accent:#B3302A;        /* tomate */
  --accent-d:#841F1A;
  --on-accent:#FFFFFF;
  --accent-soft:#FBE4DF;
  --tag:#F7D84E;           /* fita-cola e marcador */
  --tag-d:#D9B82C;
  --mark:#F7D84E;          /* marcador por baixo do separador ativo */
  --on-tag:#2A2410;
  --ok:#2C7A4B; --ok-soft:#DDF0E3;
  --warn:#8F5509; --warn-soft:#FBEBCB;
  --bad:#A4231B; --bad-soft:#F8DAD6;
  --scrim:rgba(31,20,18,.55);
  --shadow:rgba(60,35,25,.16);
  --f-display:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Courier Prime',ui-monospace,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2B1F1D; --check:rgba(255,125,105,.11); --paper:#231C1B; --card:#2E2625; --field:#1D1716;
    --ink:#F6EBDD; --ink-2:#C3B5A8; --line:#4B3E3A; --line-2:#3A302D; --line-d:#6A5A53; --rule:#41536F;
    --accent:#FF8E7F; --accent-d:#B9584B; --on-accent:#3B0E09; --accent-soft:#4A2622;
    --tag:#F0CF55; --tag-d:#C9A92F; --on-tag:#2A2410; --mark:rgba(240,207,85,.42);
    --ok:#62CB8E; --ok-soft:#183626; --warn:#F3B756; --warn-soft:#3D2F12; --bad:#FF8A80; --bad-soft:#431D1A;
    --scrim:rgba(0,0,0,.68); --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2B1F1D; --check:rgba(255,125,105,.11); --paper:#231C1B; --card:#2E2625; --field:#1D1716;
  --ink:#F6EBDD; --ink-2:#C3B5A8; --line:#4B3E3A; --line-2:#3A302D; --line-d:#6A5A53; --rule:#41536F;
  --accent:#FF8E7F; --accent-d:#B9584B; --on-accent:#3B0E09; --accent-soft:#4A2622;
  --tag:#F0CF55; --tag-d:#C9A92F; --on-tag:#2A2410; --mark:rgba(240,207,85,.42);
  --ok:#62CB8E; --ok-soft:#183626; --warn:#F3B756; --warn-soft:#3D2F12; --bad:#FF8A80; --bad-soft:#431D1A;
  --scrim:rgba(0,0,0,.68); --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--bg);
  background-image:
    repeating-linear-gradient(0deg, var(--check) 0 20px, transparent 20px 40px),
    repeating-linear-gradient(90deg, var(--check) 0 20px, transparent 20px 40px);
  color:var(--ink);
  font:400 15.5px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 112px;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}

/* a folha do caderno */
.shell{
  max-width:720px;margin:0 auto;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px 10px 6px 6px;
  box-shadow:0 2px 0 var(--line-d), 0 14px 28px -16px var(--shadow);
  padding:0 16px 22px;
  position:relative;
}
.shell::before{ /* fita de pano no topo da folha */
  content:"";display:block;height:15px;margin:0 -16px 12px;
  border-radius:9px 9px 0 0;
  background:
    repeating-linear-gradient(180deg, transparent 0 3px, var(--accent) 3px 6px, transparent 6px 9px, var(--accent) 9px 12px, transparent 12px 15px),
    var(--accent-soft);
  border-bottom:1px solid var(--line);
}

/* cabeçalho */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:2px 0 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:46px;height:46px;flex:none;color:var(--ink)}
.brand-name{
  font:700 34px/1 var(--f-display);color:var(--ink);letter-spacing:.005em;
  text-decoration:underline wavy var(--accent) 1.6px;text-underline-offset:7px;text-decoration-skip-ink:none;
}
.brand-sub{font:500 18px/1.1 var(--f-display);color:var(--ink-2);margin-top:9px}
.sync{font:400 11px/1.25 var(--f-mono);color:var(--ink-2);text-align:right;max-width:9.5em;padding-top:4px}

/* definições da semana */
.ctx{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:8px 0 14px;border-bottom:2px dashed var(--line-d);margin-bottom:12px}
.ctx .wide{grid-column:1 / -1}
.field{min-width:0}
.lbl{display:block;font:700 19px/1.1 var(--f-display);color:var(--ink-2);margin-bottom:3px}
.inp{
  width:100%;height:46px;padding:0 12px;font-size:16px;
  background:var(--field);border:1.5px solid var(--line-d);border-radius:10px;
}
textarea.inp{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
select.inp{padding-right:8px}
.step{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;height:46px;background:var(--field);border:1.5px solid var(--line-d);border-radius:10px;overflow:hidden}
.step button{border:0;background:transparent;font-size:22px;line-height:1;font-weight:700;color:var(--accent)}
.step button:active{background:var(--accent-soft)}
.step input{border:0;background:transparent;text-align:center;font-size:17px;font-weight:800;width:100%;min-width:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.money{position:relative}
.money .inp{padding-right:30px;font-weight:800}
.money span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}

/* vistas */
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 0 12px}
.h2{font:700 38px/1 var(--f-display);letter-spacing:.005em}
.sect{font:700 25px/1.1 var(--f-display);color:var(--ink);margin:22px 0 6px;padding-bottom:3px;border-bottom:1.5px dotted var(--line-d)}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 1px 0 var(--line-d)}
.sum,.day{outline:1.5px dashed var(--line-d);outline-offset:-6px;padding:18px 20px}
.day{padding-bottom:10px}
.banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--tag);color:var(--on-tag);
  border-radius:3px;padding:12px 12px 12px 16px;margin-bottom:12px;font-size:14.5px;font-weight:600;
  box-shadow:0 5px 8px -5px var(--shadow);transform:rotate(-.5deg);
}
.banner .btn.ghost{color:var(--on-tag);border-color:var(--on-tag)}
.note{font-size:13.5px;color:var(--ink-2)}
.empty{text-align:center;padding:34px 16px;color:var(--ink-2)}
.empty p{margin-bottom:14px}

/* botões */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;
  border-radius:12px;border:1.5px solid var(--line-d);background:var(--card);
  font:700 15px/1.2 var(--f-body);box-shadow:0 3px 0 var(--line-d);
}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent-d);box-shadow:0 3px 0 var(--accent-d)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:0 3px 0 var(--bad-soft)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;box-shadow:0 2px 0 var(--line-d)}
.btn.pri.sm{box-shadow:0 2px 0 var(--accent-d)}
.btn.block{width:100%}
.btn:active{transform:translateY(2px);box-shadow:none}
.x{width:38px;height:38px;border:0;background:transparent;color:var(--ink-2);font-size:24px;line-height:1;border-radius:8px;flex:none}
.x:hover{background:var(--line-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line-d);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;min-height:38px}
.chip[aria-pressed="true"]{background:var(--tag);border-color:var(--tag-d);color:var(--on-tag)}

/* resumo da semana */
.sum .eyebrow{font:700 20px/1 var(--f-display);color:var(--ink-2)}
.big{font:700 58px/.95 var(--f-display);letter-spacing:.005em;font-variant-numeric:tabular-nums}
.of{font:400 15px var(--f-mono);color:var(--ink-2);margin-left:8px}
.bar{height:12px;border-radius:7px;background:var(--line-2);border:1px solid var(--line);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}
.verdict{font-weight:700;font-size:14.5px}
.verdict.ok{color:var(--ok)} .verdict.warn{color:var(--warn)} .verdict.bad{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1.5px dotted var(--line-d)}
.stat .k{font:700 17px/1.1 var(--f-display);color:var(--ink-2)}
.stat .v{font:700 16px/1.3 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:3px}

/* dias e refeições */
.day-h{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.day-h h3{font:700 29px/1.1 var(--f-display)}
.day-h .dt{font:400 12px var(--f-mono);color:var(--ink-2)}
.day-h .dc{margin-left:auto;font:700 13px var(--f-mono);color:var(--ink-2)}
.meal{display:flex;align-items:center;gap:6px;border-top:1px solid var(--rule)}
.meal-main{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:9px 0;min-height:60px}
.meal-t{flex:1 1 auto;min-width:0}
.slot-l{display:block;font:700 17px/1.1 var(--f-display);color:var(--ink-2)}
.meal-n{display:block;font-weight:700;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.meal-n.empty-n{font-weight:700;color:var(--accent)}
.sticker{
  flex:none;display:inline-flex;align-items:baseline;gap:3px;
  background:var(--tag);color:var(--on-tag);
  font:700 25px/1 var(--f-display);font-variant-numeric:tabular-nums;
  padding:7px 13px 6px;transform:rotate(-1.6deg);
  clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%);
}
.sticker small{font:700 13px/1 var(--f-display)}
.chev{flex:none;color:var(--ink-2);font-size:24px;line-height:1;margin-left:-2px}
.meal-main.is-empty{border:1.5px dashed var(--line-d);border-radius:10px;padding:9px 12px;margin:6px 0;min-height:54px}
.meal-main.is-empty .meal-n{color:var(--accent)}

/* receitas */
.rc-name,.rc-meta{display:block}
.rcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:0 1px 0 var(--line-d)}
.rc-t{flex:1 1 auto;min-width:0}
.rc-name{font:700 26px/1.05 var(--f-display);overflow-wrap:anywhere}
.rc-meta{font-size:13px;color:var(--ink-2);margin-top:4px}
.rc-fit{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:5px;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}
.list{display:grid;gap:10px}
.tier{font:700 12.5px/1 var(--f-mono);letter-spacing:.06em;white-space:nowrap}
.tier b{color:var(--accent);font-weight:700}
.tier i{font-style:normal;color:var(--ink-2);opacity:.4}

/* folha de baixo (detalhes e editores) */
.sheet{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{
  width:100%;max-width:720px;max-height:94%;display:flex;flex-direction:column;
  background:var(--paper);border-radius:18px 18px 0 0;border-top:2px dashed var(--line-d);
  padding-bottom:env(safe-area-inset-bottom, 0px);
  animation:rise .2s ease-out;
}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px))}
.sheet-h h2{flex:1 1 auto;min-width:0;font:700 32px/1.05 var(--f-display);overflow-wrap:anywhere}
.sheet-h h2:focus{outline:none}
.sheet-b{overflow-y:auto;overscroll-behavior:contain;padding:4px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));display:grid;gap:14px;align-content:start}

/* ficha de receita: ingredientes e custo */
.receipt{
  background:var(--card);border:1px solid var(--line);border-radius:4px;padding:0 14px 12px;
  font:400 13.5px/1.5 var(--f-mono);font-variant-numeric:tabular-nums;box-shadow:0 1px 0 var(--line-d);
}
.receipt .rh{display:flex;justify-content:space-between;gap:10px;font:700 19px/1.1 var(--f-display);color:var(--accent);padding:10px 0 6px;border-bottom:2px solid var(--accent)}
.ln{display:flex;align-items:baseline;gap:8px;padding:3px 0;border-bottom:1px solid var(--rule);min-height:28px}
.ln .nm{flex:0 1 auto;min-width:0;overflow-wrap:anywhere;font-family:var(--f-body);font-weight:600;font-size:14px}
.ln .qt{flex:none;color:var(--ink-2)}
.ln .lead{flex:1 1 4px;min-width:4px}
.ln .pr{flex:none;text-align:right;min-width:62px;font-weight:700}
.tot{margin-top:8px;padding-top:6px;border-top:3px double var(--ink)}
.tot .ln{border-bottom:0}
.tot .ln.big-l{font-size:15px}
.tot .ln.big-l .nm{font:700 22px/1 var(--f-display)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.steps{margin:0;padding-left:26px;display:grid;gap:10px}
.steps li{padding-left:4px}
.steps li::marker{font:700 22px var(--f-display);color:var(--accent)}
.pickrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:58px;box-shadow:0 1px 0 var(--line-d)}
.pickrow[aria-current="true"]{border-color:var(--accent);border-width:1.5px}

/* editor */
.erow{display:grid;grid-template-columns:minmax(0,1fr) 84px 30px 38px;gap:6px;align-items:center}
.erow .u{font:400 12px var(--f-mono);color:var(--ink-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid{display:grid;gap:12px}
.narrow{max-width:210px}

/* lista de compras */
.li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--rule)}
.li:first-of-type{border-top:0}
.li input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.li-name{display:block;font-weight:700;overflow-wrap:anywhere}
.li-sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.li-price{font:700 14px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.li.done .li-name,.li.done .li-price{text-decoration:line-through;color:var(--ink-2)}
.li.dim{opacity:.75}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-size:13px;font-weight:700;text-align:left;text-decoration:underline;text-underline-offset:3px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:10px 0}
.cmp:first-child{border-top:0}
.cmp .sub{font-size:12px;color:var(--ink-2)}
.cmp .amt{font:700 14px var(--f-mono);text-align:right}
.cmp.cur .amt{color:var(--accent)}
.best{font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--ok);margin-left:6px}

/* preços */
.prow{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.prow:first-of-type{border-top:0}
.prow .pn{font-weight:700;overflow-wrap:anywhere}
.prow .ps{font-size:12px;color:var(--ink-2)}
.prow .inp{height:42px;text-align:right;font-family:var(--f-mono);font-size:15px;padding:0 10px}
.src{display:inline-block;font:700 11px/1 var(--f-mono);padding:3px 6px;border-radius:4px;background:var(--line-2);color:var(--ink-2);margin-left:6px}
.src.man{background:var(--accent-soft);color:var(--accent)}
.src.est{background:var(--warn-soft);color:var(--warn)}
details.card summary{cursor:pointer;font-weight:700;min-height:28px}
details.card[open] summary{margin-bottom:10px}
a{color:var(--accent);text-underline-offset:3px}

/* separadores: tira de pano com bainha cosida */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--paper);border-top:2px dashed var(--line-d);box-shadow:0 -6px 14px -10px var(--shadow);
  padding:0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:9px 4px 8px;color:var(--ink-2);min-height:60px}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab span{font:700 18px/1 var(--f-display);padding:0 5px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] span{color:var(--ink);background:linear-gradient(transparent 52%, var(--mark) 52%)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:40;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 80px);
  max-width:min(92vw,420px);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;text-align:center;
}

@media (min-width:560px){
  .ctx{grid-template-columns:1fr 1.2fr 1.6fr}
  .ctx .wide{grid-column:auto}
  .shell{padding-left:22px;padding-right:22px}
  .shell::before{margin-left:-22px;margin-right:-22px}
}
@media (max-width:380px){
  .brand-name{font-size:30px}
  .big{font-size:50px}
  .stats{gap:6px}
  .stat .v{font-size:14px}
  .stat .k{font-size:16px}
  .erow{grid-template-columns:minmax(0,1fr) 72px 26px 34px}
  .sum,.day{padding-left:16px;padding-right:16px}
}
/* telemóvel: menos margem lateral e alvos de toque de pelo menos 44 px */
@media (max-width:560px){
  body{padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px));padding-block:10px 112px}
  .shell{padding:0 12px 18px}
  .shell::before{margin:0 -12px 10px}
  .brand-name{font-size:26px;line-height:1.05}
  .brand-mark{width:40px;height:40px}
  .sync{max-width:8.5em;font-size:11px}
}
@media (pointer:coarse){
  button, .btn, .x, .tab{min-height:44px}
  .btn{padding-top:10px;padding-bottom:10px}
  .linkbtn{min-height:44px;display:inline-flex;align-items:center}
  .x{min-width:44px}
  input, select, textarea{min-height:44px}
}
@media (prefers-reduced-motion:reduce){
  .sheet-panel{animation:none}
  .btn:active{transform:none}
}
</style>

<div id="app" class="shell">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 12c-2-2.2 2-3.6 0-6M24 12c-2-2.2 2-3.6 0-6M31 12c-2-2.2 2-3.6 0-6" stroke="var(--ink-2)"/>
        <path d="M12 21a12 5 0 0 1 24 0"/>
        <path d="M9 21h30"/>
        <path d="M11 21v14a6 6 0 0 0 6 6h14a6 6 0 0 0 6-6V21" fill="var(--paper)"/>
        <path d="M11 26H5M37 26h6"/>
        <path d="M24 37c-5-3.4-7.2-6-7.2-8.6a3.6 3.6 0 0 1 7.2-1 3.6 3.6 0 0 1 7.2 1c0 2.6-2.2 5.2-7.2 8.6z" fill="var(--accent)" stroke="var(--accent)"/>
      </svg>
      <div>
        <p class="brand-name">A Mãe é que Sabe</p>
        <p class="brand-sub">receitas, semana e compras</p>
      </div>
    </div>
    <span id="sync" class="sync" aria-live="polite"></span>
  </header>

  <section class="ctx" aria-label="Definições da semana">
    <div class="field">
      <label class="lbl" for="inPeople">Pessoas</label>
      <div class="step">
        <button type="button" data-act="p-dec" aria-label="Menos uma pessoa">&minus;</button>
        <input id="inPeople" type="number" min="1" max="12" inputmode="numeric">
        <button type="button" data-act="p-inc" aria-label="Mais uma pessoa">+</button>
      </div>
    </div>
    <div class="field">
      <label class="lbl" for="inBudget">Orçamento semanal</label>
      <div class="money"><input id="inBudget" class="inp" type="number" min="0" step="1" inputmode="decimal"><span>&euro;</span></div>
    </div>
    <div class="field wide">
      <label class="lbl" for="selStore">Onde compras</label>
      <select id="selStore" class="inp"></select>
    </div>
  </section>

  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabs" id="tabs" aria-label="Secções">
  <button type="button" class="tab" data-act="tab" data-tab="semana">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Semana</span>
  </button>
  <button type="button" class="tab" data-act="tab" data-tab="receitas">

  </button>
  <button type="button" class="tab" data-act="tab" data-tab="lista">

  </button>
  <button type="button" class="tab" data-act="tab" data-tab="precos">

  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

      <button type="button" class="x" data-act="sheet-close" aria-label="Fechar">&times;</button>

    <div class="sheet-b" id="sheetBody"></div>

</div>
